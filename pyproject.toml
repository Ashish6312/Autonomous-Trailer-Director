[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trailer-director"
version = "0.1.0"
description = "Autonomous Trailer Director: audience-specific trailer plans, LLM-proposed and deterministically verified."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
multimodal = ["google-genai>=1.0"]
dev = ["pytest>=8", "anthropic>=1.0", "google-genai>=1.0"]

[project.scripts]
trailer-director = "trailer_director.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trailer_director"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
